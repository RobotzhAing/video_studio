name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            asset: mac-arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            asset: mac-x64
          - runner: windows-2025
            platform: win
            arch: x64
            asset: win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_ASSET: ${{ matrix.asset }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Check native architecture and release version
        run: |
          node -e 'if (process.arch !== process.env.BUILD_ARCH) throw Error("Node architecture mismatch")'
          python -c 'import os,platform; m={"AMD64":"x64","x86_64":"x64","arm64":"arm64","aarch64":"arm64"}; assert m.get(platform.machine())==os.environ["BUILD_ARCH"]'
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - name: Install the FFprobe binary matching the bundled FFmpeg
        run: |
          mkdir -p build/upstream
          if [[ "$BUILD_PLATFORM" == mac ]]; then
            upstream="darwin-$BUILD_ARCH"
            output="$PWD/build/upstream/ffprobe"
          else
            upstream="win32-$BUILD_ARCH"
            output="$PWD/build/upstream/ffprobe.exe"
          fi
          curl --fail --show-error --location --retry 3 \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffprobe-$upstream" \
            --output "$output"
          chmod +x "$output"
          VIDEOFUSION_FFPROBE_BUILD="$(node -p 'require("path").resolve(process.argv[1])' "build/upstream/$(basename "$output")")" \
            npm run prepare:runtime
      - name: Use the bundled media tools in tests
        run: |
          python -c 'from pathlib import Path; import os; p=Path("build/runtime").resolve(); open(os.environ["GITHUB_PATH"],"a",encoding="utf-8").write(str(p)+"\n")'
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package native desktop application
        run: |
          if [[ "$BUILD_PLATFORM" == mac ]]; then
            npm exec -- electron-builder --mac "--$BUILD_ARCH" --dir --publish never --config.directories.output=build/ci-dist
          else
            npm exec -- electron-builder --win portable "--$BUILD_ARCH" --publish never --config.directories.output=build/ci-dist
          fi
      - name: Verify packaged runtime and prepare download
        run: |
          python - <<'PY'
          import json, os, pathlib, re, shutil, subprocess, tempfile, time, urllib.request

          platform = os.environ['BUILD_PLATFORM']
          arch = os.environ['BUILD_ARCH']
          meta = json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))
          dist = pathlib.Path('build/ci-dist').resolve()
          asset_dir = pathlib.Path('release-assets').resolve()
          asset_dir.mkdir(exist_ok=True)
          asset = asset_dir / f"VideoFusion-Studio-{meta['version']}-{os.environ['BUILD_ASSET']}"
          suffix = '.exe' if platform == 'win' else ''
          if platform == 'mac':
              (app,) = list(dist.glob('*/VideoFusion Studio.app'))
              resources = app / 'Contents/Resources'
              executable = app / 'Contents/MacOS/VideoFusion Studio'
          else:
              resources = dist / 'win-unpacked/resources'
              executable = dist / 'win-unpacked/VideoFusion Studio.exe'

          runtime = resources / 'runtime'
          ffmpeg, ffprobe, backend = (
              runtime / (name + suffix) for name in ('ffmpeg', 'ffprobe', 'VideoFusionBackend')
          )
          subprocess.run(
              ['node', '-e',
               'for (const f of process.argv.slice(1)) require("./scripts/check-binary-architecture.cjs").assertArchitecture(f)',
               str(executable), str(ffmpeg), str(ffprobe), str(backend)], check=True
          )
          with tempfile.TemporaryDirectory(prefix='videofusion-build-') as tmp:
              root = pathlib.Path(tmp)
              font = r'C\:/Windows/Fonts/arial.ttf' if platform == 'win' else '/System/Library/Fonts/Supplemental/Arial.ttf'
              sample = root / 'sample.mp4'
              subprocess.run([str(ffmpeg), '-hide_banner', '-loglevel', 'error',
                              '-f', 'lavfi', '-i', 'color=c=black:s=320x180:d=0.25',
                              '-vf', f"drawtext=fontfile='{font}':text='ok':fontsize=20",
                              '-c:v', 'libx264', str(sample)], check=True, timeout=30)
              subprocess.run([str(ffprobe), '-v', 'error', str(sample)], check=True, timeout=15)

              log = root / 'backend.log'
              with log.open('wb') as out:
                  proc = subprocess.Popen([str(backend), '--port', '0', '--web-dir', str(resources / 'web')],
                                          env={**os.environ, 'VIDEOSTUDIO_DATA_DIR': str(root / 'data'),
                                               'VIDEOSTUDIO_FFMPEG': str(ffmpeg), 'VIDEOSTUDIO_FFPROBE': str(ffprobe)},
                                          stdout=out, stderr=subprocess.STDOUT)
                  try:
                      opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
                      deadline = time.monotonic() + 45
                      while time.monotonic() < deadline:
                          message = log.read_text(errors='replace')
                          match = re.search(r'VideoStudio ready on (http://127\.0\.0\.1:\d+)', message)
                          if match:
                              base = match.group(1)
                              with opener.open(base + '/api/health', timeout=5) as health:
                                  assert health.status == 200
                              with opener.open(base + '/', timeout=5) as index:
                                  assert b'batch-tasks.js' in index.read()
                              break
                          if proc.poll() is not None:
                              raise RuntimeError(f'Packaged backend exited: {message}')
                          time.sleep(0.2)
                      else:
                          raise RuntimeError(f'Packaged backend did not start: {message}')
                  finally:
                      if proc.poll() is None:
                          if platform == 'win':
                              subprocess.run(['taskkill', '/PID', str(proc.pid), '/T', '/F'],
                                             check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          else:
                              proc.terminate()
                      proc.wait(timeout=10)
          if platform == 'mac':
              import zipfile
              target = pathlib.Path(str(asset) + '.zip')
              subprocess.run(['ditto', '-c', '-k', '--norsrc', '--keepParent', str(app), str(target)], check=True)
              with zipfile.ZipFile(target) as archive:
                  assert archive.testzip() is None
          else:
              (portable,) = list(dist.glob('*.exe'))
              shutil.copy2(portable, pathlib.Path(str(asset) + '.exe'))
          PY
      - name: Save platform download
        uses: actions/upload-artifact@v7
        with:
          name: VideoFusion-Studio-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: VideoFusion-Studio-*
          path: release-assets
          merge-multiple: true
      - name: Check the complete set and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release-assets
          files=(
            "VideoFusion-Studio-$version-mac-arm64.zip"
            "VideoFusion-Studio-$version-mac-x64.zip"
            "VideoFusion-Studio-$version-win-x64.exe"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "VideoFusion Studio $GITHUB_REF_NAME" \
            --notes "下载与你的系统和芯片匹配的版本：Mac 解压后双击 VideoFusion Studio.app；Windows x64 双击便携版 EXE。使用教程见[仓库 README](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME#readme)。"
